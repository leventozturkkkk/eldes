<html lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>Contact V5</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="https://colorlib.com/etc/cf/ContactFrom_v5/images/icons/favicon.ico">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/material-design-iconic-font.min.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/animate.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/hamburgers.min.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/animsition.min.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/select2.min.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/daterangepicker.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/nouislider.min.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/util.css">
	<link rel="stylesheet" type="text/css" href="./contact_bootstrap_files/main.css">
	<meta name="robots" content="noindex, follow">
</head>

<body>
	<div class="container-contact100">
		<div class="wrap-contact100">
			<form class="contact100-form validate-form">
				<span class="contact100-form-title">
					Contact Us
				</span>
				<div class="wrap-input100 validate-input bg1" data-validate="Please Type Your Name">
					<span class="label-input100">FULL NAME *</span>
					<input class="input100" type="text" name="name" placeholder="Enter Your Name">
				</div>
				<div class="wrap-input100 validate-input bg1 rs1-wrap-input100"
					data-validate="Enter Your Email (e@a.x)">
					<span class="label-input100">Email *</span>
					<input class="input100" type="text" name="email" placeholder="Enter Your Email ">
				</div>
				<div class="wrap-input100 bg1 rs1-wrap-input100">
					<span class="label-input100">Phone</span>
					<input class="input100" type="text" name="phone" placeholder="Enter Number Phone">
				</div>
				<div class="w-full dis-none js-show-service">
					<div class="wrap-contact100-form-radio">
						<span class="label-input100">What type of products do you sell?</span>
						<div class="contact100-form-radio m-t-15">
							<input class="input-radio100" id="radio1" type="radio" name="type-product" value="physical"
								checked="checked">
							<label class="label-radio100" for="radio1">
								Phycical Products
							</label>
						</div>
						<div class="contact100-form-radio">
							<input class="input-radio100" id="radio2" type="radio" name="type-product" value="digital">
							<label class="label-radio100" for="radio2">
								Digital Products
							</label>
						</div>
						<div class="contact100-form-radio">
							<input class="input-radio100" id="radio3" type="radio" name="type-product" value="service">
							<label class="label-radio100" for="radio3">
								Services Consulting
							</label>
						</div>
					</div>
					<div class="wrap-contact100-form-range">
						<span class="label-input100">Budget *</span>
						<div class="contact100-form-range-value">
							$<span id="value-lower">1500</span> - $<span id="value-upper">3900</span>
							<input type="text" name="from-value">
							<input type="text" name="to-value">
						</div>
						<div class="contact100-form-range-bar">
							<div id="filter-bar" class="noUi-target noUi-ltr noUi-horizontal">
								<div class="noUi-base">
									<div class="noUi-origin" style="left: 0%;">
										<div class="noUi-handle noUi-handle-lower" data-handle="0" tabindex="0"
											role="slider" aria-orientation="horizontal" aria-valuemin="0.0"
											aria-valuemax="40.0" aria-valuenow="0.0" aria-valuetext="1500.00"
											style="z-index: 5;"></div>
									</div>
									<div class="noUi-connect" style="left: 0%; right: 60%;"></div>
									<div class="noUi-origin" style="left: 40%;">
										<div class="noUi-handle noUi-handle-upper" data-handle="1" tabindex="0"
											role="slider" aria-orientation="horizontal" aria-valuemin="0.0"
											aria-valuemax="100.0" aria-valuenow="40.0" aria-valuetext="3900.00"
											style="z-index: 6;"></div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="wrap-input100 validate-input bg0 rs1-alert-validate"
					data-validate="Please Type Your Message">
					<span class="label-input100">Message</span>
					<textarea class="input100" name="message" placeholder="Your message here..."></textarea>
				</div>
				<div class="container-contact100-form-btn">
					<button class="contact100-form-btn">
						<span>
							Submit
							<i class="fa fa-long-arrow-right m-l-7" aria-hidden="true"></i>
						</span>
					</button>
				</div>
			</form>
		</div>
	</div>

	<script type="text/javascript" async="" src="./contact_bootstrap_files/analytics.js"></script>
	<script src="./contact_bootstrap_files/jquery-3.2.1.min.js"></script>

	<script src="./contact_bootstrap_files/animsition.min.js"></script>

	<script src="./contact_bootstrap_files/popper.js"></script>
	<script src="./contact_bootstrap_files/bootstrap.min.js"></script>

	<script src="./contact_bootstrap_files/select2.min.js"></script>
	<script>
		$(".js-select2").each(function () {
			$(this).select2({
				minimumResultsForSearch: 20,
				dropdownParent: $(this).next('.dropDownSelect2')
			});


			$(".js-select2").each(function () {
				$(this).on('select2:close', function (e) {
					if ($(this).val() == "Please chooses") {
						$('.js-show-service').slideUp();
					}
					else {
						$('.js-show-service').slideUp();
						$('.js-show-service').slideDown();
					}
				});
			});
		})
	</script>

	<script src="./contact_bootstrap_files/moment.min.js"></script>
	<script src="./contact_bootstrap_files/daterangepicker.js"></script>

	<script src="./contact_bootstrap_files/countdowntime.js"></script>

	<script src="./contact_bootstrap_files/nouislider.min.js"></script>
	<script>
		var filterBar = document.getElementById('filter-bar');

		noUiSlider.create(filterBar, {
			start: [1500, 3900],
			connect: true,
			range: {
				'min': 1500,
				'max': 7500
			}
		});

		var skipValues = [
			document.getElementById('value-lower'),
			document.getElementById('value-upper')
		];

		filterBar.noUiSlider.on('update', function (values, handle) {
			skipValues[handle].innerHTML = Math.round(values[handle]);
			$('.contact100-form-range-value input[name="from-value"]').val($('#value-lower').html());
			$('.contact100-form-range-value input[name="to-value"]').val($('#value-upper').html());
		});
	</script>

	<script src="./contact_bootstrap_files/main.js"></script>

	<script async="" src="./contact_bootstrap_files/js"></script>

		window.dataLayer = window.dataLayer || [];
